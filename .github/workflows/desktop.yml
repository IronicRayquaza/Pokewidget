# Desktop test builds for Windows, macOS and Linux — run by hand, never released.
#
# Actions → desktop → Run workflow, pick a branch. Each OS's installer is uploaded to the run as
# a workflow artifact, which anyone with access to the repo can download from the run page
# while signed in to GitHub. Nothing here creates a tag, a release or a draft release: shipping
# is a separate, deliberate step, not a side effect of testing a build.
#
# Unsigned: Windows SmartScreen and macOS Gatekeeper both warn, the same way the Android APK
# does. See web/README.md for what testers do about it. The macOS build is universal, so one
# .dmg runs on Apple Silicon and Intel Macs alike.
name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
            bundle: web/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos-universal
            args: '--target universal-apple-darwin'
            bundle: web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            args: ''
            bundle: web/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # The Tauri CLI directly rather than tauri-action: the action's job is publishing a
      # release, and this workflow must never do that.
      - run: npx tauri build ${{ matrix.args }}
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: pokewidget-desktop-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14
