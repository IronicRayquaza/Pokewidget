# Posts a line in #announcements whenever a release is published.
#
# The step people skip is the one they do last, tired, after the build and the upload. This is
# that step. It carries no secrets beyond the webhook URL, and does nothing at all if the
# webhook has not been set — so the workflow can be merged before the Discord server exists.
#
# Setup: Server Settings -> Integrations -> Webhooks, create one pointed at #announcements,
# then paste the URL into repo Settings -> Secrets and variables -> Actions as
# DISCORD_RELEASE_WEBHOOK.
name: Announce release in Discord

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
        if: env.WEBHOOK != ''
        run: |
          # Built with jq rather than string interpolation so a quote or a newline in the tag
          # cannot produce invalid JSON, or worse.
          body=$(jq -n --arg content "**PokéWidget $TAG** is out. $URL" '{content: $content}')

          # `curl --fail` was hiding why this failed, which cost a debugging round trip on the
          # very first release. Capture the status instead and print it. The webhook URL is a
          # credential on its own — anyone holding it can post as the webhook — so it is never
          # echoed, and only Discord's reply is shown.
          status=$(curl --silent --show-error --output response.txt \
            --write-out "%{http_code}" -X POST \
            -H "Content-Type: application/json" --data "$body" "$WEBHOOK")

          echo "Discord replied HTTP $status"
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "--- response body ---"
            cat response.txt || true
            echo "---"
            echo "401 or 404 means the webhook URL is wrong, truncated, or has been deleted."
            echo "000 means it could not be reached at all."
            exit 1
          fi
