# Android test build — never released.
#
# Runs on every push to a dev/* branch that touches the app, or by hand (Actions → android →
# Run workflow) once this file is on main. Runs the unit tests, builds the debug APK and
# uploads it to the run as a 14-day artifact, downloadable by anyone signed in to GitHub with
# access to the repo. Nothing here creates a tag, a release or a draft release.
#
# The debug build installs *next to* the released app (package `com.pokewidgets.app.debug`,
# version shown as "1.6-debug"), so testers keep their working 1.5 widgets while they try it.
# CI signs it with a fresh debug key each run, so a newer test build will not install over an
# older one: uninstall the old "PokéWidget" debug app first.
name: android

on:
  push:
    branches: ['dev/**']
    paths: ['app/**', 'gradle/**', '*.gradle.kts', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The wrapper is not marked executable in the repo.
      - run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK after the version and commit
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "pokewidget-${version}-debug-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pokewidget-android-debug-${{ github.sha }}
          path: pokewidget-*-debug-*.apk
          if-no-files-found: error
          retention-days: 14
