# AGP 7.4.1 runs on JDK 17 and does not support 18. This machine's `java` on PATH *is* 18
# and the bundled Android Studio JBR is 11, so point Gradle at the Temurin 17 it already
# provisioned. Without this the build fails outright here, so it is not optional.
# Machine-specific: change this path (or delete the line if your default JDK is already 17)
# on another machine. It is the one line in the repo that assumes a particular computer.
org.gradle.java.home=C:/Users/satya/.gradle/jdks/eclipse_adoptium-17-amd64-windows.2

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# compileSdk 34 is what AGP 7.4.1 is tested against, so nothing to suppress.
